name: Bug report
description: Something didn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test this alpha, an early version of Exegete.

        An issue is public. Anyone can read it, and search engines find it, so participants' data or a project put into an issue is published with it. You can describe the data without copying it, such as "a code name with an apostrophe" or "a file of about 40,000 characters". A made-up example, or one with names and details removed, usually shows the problem as well. [SUPPORT.md](https://github.com/nicotem/exegete/blob/main/SUPPORT.md) says what a report needs and what a log can hold. [PRIVACY.md](https://github.com/nicotem/exegete/blob/main/PRIVACY.md) says what leaves your computer when you use Exegete.

        A fault in this alpha could change a project in a way you did not intend. Before you try the problem again, you could work on a copy of the project. The assistant can make one with the tool `copy_project_to_workspace`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you ask your AI assistant to do, and what went wrong?
      placeholder: I asked the assistant to merge two codes and it…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "What you asked, step by step, and which of Exegete's tools the assistant used, if the conversation shows them. A conversation copied in can carry passages of your documents, in the assistant's replies and in the tools' answers. You could describe each step in your own words instead, or copy only lines that hold no participants' data."
    validations:
      required: false
  - type: input
    id: mcp-version
    attributes:
      label: Exegete version
      description: "With the Claude Desktop extension, the version is in the name of the `.mcpb` file you installed. If you installed from the Terminal, `exegete --version` gives it, run in the environment you installed into. For an install from the source, the command is `python -m exegete.server --version`. An install made under the earlier name, qualcoder-mcp, answers `qualcoder-mcp --version` too. `pip show exegete`, `pipx list` and `uv tool list` also give it. The commands write the version as PyPI does, with a0 for -alpha, and either spelling is fine. If you ask the assistant instead, it may answer without asking Exegete, so the file name or a command is surer."
      placeholder: e.g. 0.15.3a0
    validations:
      required: true
  - type: input
    id: qualcoder-version
    attributes:
      label: QualCoder version, if you use it
      description: 'Its release, 3.8.x or 4.0, or "none" if you do not use it. For a build from its source, add the git commit if you know it.'
      placeholder: e.g. 3.8.2, 4.0 or none
    validations:
      required: false
  - type: input
    id: schema-version
    attributes:
      label: Project schema version
      description: The version of your project's database layout. You can ask the assistant for it. It is the `databaseversion` value in the `schema` part of what the tool `get_current_project` returns. Exegete supports schemas v14 to v17.
      placeholder: e.g. v14 or v17
    validations:
      required: false
  - type: dropdown
    id: host
    attributes:
      label: The app you use Exegete in
      description: The application that runs Exegete for you.
      options:
        - Claude Desktop with the extension (.mcpb)
        - Claude Desktop set up by hand
        - Claude Code
        - ChatGPT's desktop app or Codex
        - LM Studio
        - Other (say which under "What happened?")
    validations:
      required: true
  - type: dropdown
    id: toolset
    attributes:
      label: Tool set
      description: "`full`, the default, has every tool, creating a project included. `core` is a smaller set, meant for models that run on your own computer. With the Claude Desktop extension, the tool set is `core` when its switch \"Limit Exegete to its small tool set\" is on, and `full` otherwise. For other installs, the setting EXEGETE_TOOLSET chooses it, and Exegete takes `full` when it is not set. `full` was called `lifecycle` before 0.15.0."
      options:
        - full (the default)
        - core
        - lifecycle (the earlier name of full)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: qualcoder-open
    attributes:
      label: If you use QualCoder, was the project open in it at the time?
      description: A lock file is a small file in a project's folder that marks the project as in use. Exegete refuses every change to the project's database while its lock file is active. QualCoder 3.8.2 writes one while it has the project open, and so does another conversation using Exegete while it writes. QualCoder 4.0 writes no lock file. Exegete looks for signs of an open 4.0 window, but it can miss one.
      options:
        - "No"
        - "Yes"
        - Not sure
        - I don't use QualCoder
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.11
    validations:
      required: false
