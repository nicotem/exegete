name: Feature idea
description: Something that would make Exegete more useful for your research
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Exegete's next features are worked out with the researchers who use it now, so ideas are as welcome as bug reports.
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The research task or workflow behind the idea, not only the feature. Knowing the need behind it helps to decide what to build.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working, if you have a picture in mind.
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: How do you handle this today?
    validations:
      required: false
