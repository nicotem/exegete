name: Weekly advisory check

# v0.15.1: every release in uv.lock against the published advisories
# (scripts/check_advisories.py, which asks OSV, https://osv.dev), once a
# week, since an advisory can be published for a release the lock
# already holds without any change here. v0.15.2: and every release in
# the official validator's lock (packaging/desktop-extension/validator),
# the libraries CI installs to check the desktop extension's manifest,
# where `npm ci` runs no audit. A new advisory fails; one already read
# and accepted (KNOWN in the script, or KNOWN_NPM for the validator's,
# each with its date and reason) is a notice, and so is an accepted one
# no longer reported, whose entry can then go. The table is in the step
# summary. A workflow of its own, so that a push changing only a lock
# checks the advisories and no third-party site. A schedule runs from
# main only, so a push that changes this workflow, the script or either
# lock also runs it, on its branch.
on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/advisories.yml"
      - "scripts/check_advisories.py"
      - "uv.lock"
      - "packaging/desktop-extension/validator/package-lock.json"

jobs:
  advisories:
    name: advisories against the locked releases
    runs-on: ubuntu-latest
    # The check is one request of at most 60 seconds, tried once more
    # after 30; ten minutes leave room for the checkout and Python.
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: The locked releases against OSV's advisories
        run: python scripts/check_advisories.py uv.lock packaging/desktop-extension/validator/package-lock.json
