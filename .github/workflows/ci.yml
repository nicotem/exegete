name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # v0.15.2, the two tiers (ruling 100): which jobs this run takes, chosen
  # in one place, scripts/ci_tier.py, which says how. A push to a branch
  # other than `main` and `feat/*` takes the fast tier: the suite once, on
  # Ubuntu with Python 3.13, and the documents job, with the desktop
  # extension's jobs only when the branch changed the packaging, the lock
  # or a script they run. Every other run takes the full tier, the whole
  # matrix. Only an explicit `true` narrows a run: the exclusions and
  # conditions below read an empty or missing output as the full tier,
  # and a failure here skips the jobs that need it and turns the run red.
  tier:
    name: tier
    runs-on: ubuntu-latest
    # A checkout and a few git commands; five minutes ends a hang.
    timeout-minutes: 5
    # Reads the checkout, nothing else.
    permissions:
      contents: read
    # Without this block, `needs.tier.outputs` reads empty everywhere.
    outputs:
      fast: ${{ steps.choose.outputs.fast }}
      skip_extension: ${{ steps.choose.outputs.skip_extension }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every branch and its history, for the point where this branch
          # left its integration branch or main.
          fetch-depth: 0
          persist-credentials: false

      # The runner's own Python, since the script needs the standard
      # library alone. The event and the ref reach it through its
      # environment, never pasted into this line.
      - name: Choose the tier
        id: choose
        run: python3 scripts/ci_tier.py

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.os == 'windows-latest' && format(', part {0} of 3', matrix.part) || '' }})
    needs: tier
    runs-on: ${{ matrix.os }}
    # A limit on the whole job (v0.14): GitHub's default is six hours, so
    # a hung test held a runner that long. In the 120 green runs from 7 to
    # 25 September 2026 the slowest job took 58 min 46 s (Windows, Python
    # 3.10) against a Windows median of 23 minutes, and seven Windows jobs
    # ran past 45 minutes; Linux and macOS took 15 minutes at most. Ninety
    # minutes is about one and a half times the slowest green job. A hung
    # test is named well before this, by the per-test limit in
    # pyproject.toml (faulthandler_timeout).
    timeout-minutes: 90
    # Least privilege for the job's GITHUB_TOKEN: the job reads the
    # checkout and uploads an artefact, and needs nothing else. Without a
    # permissions block the token takes the repository default, which is
    # read/write unless the owner has changed it, in a job that installs
    # and runs third-party code on every branch push.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # v0.15.2 (the owner's ruling of 27 October 2026): Python 3.11,
        # the oldest Exegete supports, and 3.13, the desktop extension's,
        # on every system; 3.14, the newest, on Ubuntu alone (the
        # exclusions below).
        python-version: ["3.11", "3.13", "3.14"]
        # v0.15: Windows runs the suite in three parts, a job each, as one
        # job there took 40 to 60 minutes; Linux and macOS keep one job,
        # part 1 alone (the exclusions below). tests/conftest.py makes
        # the parts from whole files, weighed by their number of tests.
        # Not pytest-xdist: it would be a new dependency, and tests run
        # side by side would slow the ones that measure time.
        part: [1, 2, 3]
        exclude:
          - os: ubuntu-latest
            part: 2
          - os: ubuntu-latest
            part: 3
          - os: macos-latest
            part: 2
          - os: macos-latest
            part: 3
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          # v0.15.2, the fast tier (the `tier` job): Ubuntu with Python
          # 3.13 alone. Each value names a matrix entry only on an
          # explicit fast answer; otherwise it is 'none', which names no
          # entry and leaves the full matrix.
          - os: ${{ needs.tier.outputs.fast == 'true' && 'windows-latest' || 'none' }}
          - os: ${{ needs.tier.outputs.fast == 'true' && 'macos-latest' || 'none' }}
          - python-version: ${{ needs.tier.outputs.fast == 'true' && '3.11' || 'none' }}
          - python-version: ${{ needs.tier.outputs.fast == 'true' && '3.14' || 'none' }}

    steps:
      # Actions are SHA-pinned (supply-chain hardening); the trailing
      # comment is the human-readable version Dependabot bumps against.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keep the token out of .git/config: nothing here pushes,
          # fetches a submodule or uses git credentials, and the steps
          # below install and run third-party code.
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # From the lock (v0.15.1): the suite runs with the releases the
      # desktop extension installs, so a new release on PyPI can no
      # longer turn a job red overnight, as PyMuPDF 2.0 did on 19 October
      # 2026 (run 39270048143, Ubuntu on Python 3.13) while the lock held
      # 1.28.2. The newest releases have a job of their own,
      # newest-libraries, which may fail and only reports. uv, at the
      # version the extension job uses, has an environment of its own and
      # is called through that environment's Python, so it never joins
      # the suite's path (a test of the real uv tool skips where there is
      # none). `--locked` fails when pyproject.toml and uv.lock disagree,
      # so a limit changed without `uv lock` is caught on the push. pip
      # then installs the exported releases, each checked against its
      # hash, into the job's own Python, and the package itself without
      # its dependencies. With the optional part (0.14.3), so the PDF and
      # EPUB import tests run on every platform rather than skip.
      - name: Install package and dev dependencies from the lock
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m venv "$RUNNER_TEMP/uv-env"
          uvpy="$RUNNER_TEMP/uv-env/bin/python"
          [ -e "$uvpy" ] || uvpy="$RUNNER_TEMP/uv-env/Scripts/python.exe"
          "$uvpy" -m pip install "uv==0.9.7"
          "$uvpy" -m uv export --locked --extra dev --extra pdf-epub --no-emit-project --output-file "$RUNNER_TEMP/locked.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/locked.txt"
          python -m pip install --no-deps -e .

      - name: Run test suite
        shell: bash
        # "k/3" on Windows (tests/conftest.py); empty elsewhere: every test
        env:
          EXEGETE_TEST_SHARD: ${{ matrix.os == 'windows-latest' && format('{0}/3', matrix.part) || '' }}
        run: |
          set +e
          python -m pytest -ra --tb=short -q 2>&1 | tee pytest_output.txt
          code=${PIPESTATUS[0]}
          {
            echo "### pytest: ${{ matrix.os }} / py${{ matrix.python-version }}${{ matrix.os == 'windows-latest' && format(', part {0} of 3', matrix.part) || '' }}"
            echo ""
            echo '```'
            grep -E "^[0-9]+ (passed|failed)| failed,| error" pytest_output.txt | tail -3
            grep -E "^(FAILED|ERROR) " pytest_output.txt | head -60
            # Ruling 7: the file-text count's rate and the worst case of
            # its three budgets on this platform, readable from the public
            # run page without admin rights. Since fix round 5 everything
            # a count spends is charged, and since fix round 6 a file is
            # priced at its reading and a form by its length, so that is
            # the count's worst case on realistic input (ruling 7's scope).
            grep -E "^file-text count rate: " pytest_output.txt | head -3
            # v0.13 Brief 2: the note pass's rate, outside the budgets,
            # published so the slowest platform's figure can be stated.
            grep -E "^note pass rate: " pytest_output.txt | head -3
            # v0.14 brief C: what Windows and SQLite do when a project is
            # created near Windows' path limit (the Windows jobs only).
            grep -E "^Windows path probe: " pytest_output.txt | head -3
            # v0.15: on Windows, the part's share and the split's
            # fingerprint, the same in the three parts of one Python when
            # each file ran in exactly one (tests/conftest.py).
            grep -E "^test part: " pytest_output.txt | head -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The same line as a check-run annotation: a job's step summary
          # is hidden from signed-out visitors, and annotations are public
          # through the API (/check-runs/<id>/annotations), so ruling 7's
          # constant can be frozen from all six platforms without admin
          # rights (v0.13 fix round 2).
          sed -n 's/^file-text count rate: /::notice title=file-text count rate::/p' pytest_output.txt | head -3
          sed -n 's/^note pass rate: /::notice title=note pass rate::/p' pytest_output.txt | head -3
          sed -n 's/^Windows path probe: /::notice title=Windows path probe::/p' pytest_output.txt | head -3
          sed -n 's/^test part: /::notice title=test part::/p' pytest_output.txt | head -1
          # The failures themselves as annotations, for the same reason:
          # a signed-out reader cannot open the job log, and can read
          # these through the API. Up to ten FAILED or ERROR lines, each
          # with pytest's short message, and the summary line; when there
          # is none (the run ended before pytest could write it), the
          # last ten lines of the output instead. A percent sign is
          # escaped, as the workflow-command syntax requires.
          grep -E "^(FAILED|ERROR) " pytest_output.txt | head -10 \
            | sed -e 's/%/%25/g' -e 's/^/::error title=pytest::/'
          summary=$(grep -E "^[0-9]+ (passed|failed|error)|^(=+ )?[0-9]+ (failed|passed|errors?)[ ,]" pytest_output.txt | tail -1)
          if [ -n "$summary" ]; then
            echo "::notice title=pytest summary::$(echo "$summary" | sed 's/%/%25/g')"
          else
            tail -10 pytest_output.txt | sed -e 's/%/%25/g' -e 's/^/::error title=pytest output tail::/'
          fi
          exit $code

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # a name used twice in one run is refused, so each part's own
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}${{ matrix.os == 'windows-latest' && format('-part{0}', matrix.part) || '' }}
          path: pytest_output.txt

  desktop-extension:
    name: desktop extension (${{ matrix.os }})
    # v0.15.2: on the fast tier, only when the branch changed the
    # packaging, the lock or a script this job runs (scripts/ci_tier.py
    # names them); on the full tier, always. An empty answer runs it.
    # desktop-extension-same, which needs this job, follows it.
    needs: tier
    if: needs.tier.outputs.skip_extension != 'true'
    runs-on: ${{ matrix.os }}
    # Building, validating and trying the package takes a few minutes
    # (the try fetches Python and the locked dependencies through uv);
    # twenty is several times that, and a hang is ended well before the
    # suite's ninety.
    timeout-minutes: 20
    # Read the checkout and upload an artefact, nothing else (as `test`).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # The build starts the server to ask for its tools, so it needs
      # the package's own dependency (mcp) in this interpreter.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # From the commit, not the working tree, twice: the second build
      # must give the same bytes. The SHA-256 goes to the run's summary
      # and to an annotation, and the next job compares the platforms.
      - name: Build the extension twice from this commit
        shell: bash
        run: |
          python scripts/build_desktop_extension.py --ref HEAD --out dist/mcpb | tee build.txt
          python scripts/build_desktop_extension.py --ref HEAD --out dist/again
          cmp dist/mcpb/*.mcpb dist/again/*.mcpb
          {
            echo "### desktop extension: ${{ matrix.os }}"
            echo ""
            echo '```'
            cat build.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed -n 's/^SHA-256: */::notice title=desktop extension SHA-256 (${{ matrix.os }})::/p' build.txt

      # Uploaded before any third-party tool runs, so nothing after this
      # step can change what was built.
      - name: Upload the extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-extension-${{ matrix.os }}
          path: dist/mcpb/*.mcpb

      # The official validator, @anthropic-ai/mcpb, at the version and
      # with the dependencies locked in packaging/desktop-extension/
      # validator (npm ci checks every package's integrity hash; no
      # install scripts run). Node comes with the runner.
      - name: Validate the manifest with the official MCPB tooling
        if: runner.os == 'Linux'
        shell: bash
        working-directory: packaging/desktop-extension/validator
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install mcpb validate ../../../dist/mcpb/exegete-*/manifest.json
          npx --no-install mcpb info ../../../dist/mcpb/*.mcpb

      # The uv Claude Desktop 2.9939.2 downloads when a computer has none.
      - name: Install uv 0.9.7
        run: pip install uv==0.9.7

      # The app's `uv sync` must never compile anything on a researcher's
      # computer (fix round 1: cryptography had no wheel for Intel Macs or
      # Windows on Arm). Asked of the shipped lock itself, for every
      # computer pyproject's [tool.uv] names, on the package's Python:
      # nothing but the project may be built. v0.15.1: each computer's
      # report is also kept, for the table below; uv writes it, the
      # `+ name==version` lines included, to standard error, and bash runs
      # this with pipefail, so a failing uv still fails the step.
      - name: Check the lock has a wheel for every computer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dry-run"
          cd dist/mcpb/exegete-*/
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            echo "== $target"
            uv sync --frozen --dry-run --no-install-project --no-build --extra pdf-epub --python "$(cat .python-version)" --python-platform "$target" 2>&1 | tee "$RUNNER_TEMP/dry-run/$target.txt"
          done

      # v0.15.1: what the extension installs, one table in the run's
      # summary, from the six reports above (scripts/extension_libraries.py
      # fails on a report with no install line). Each release's notes copy
      # the release commit's table under "What the extension installs".
      # --check-pymupdf: it also fails when a computer's report does not
      # install the PyMuPDF pyproject.toml gives it (2.x with onnxruntime
      # on Windows x64 and Linux, 1.x elsewhere), since uv evaluates
      # markers for a computer it is asked about, not the one it runs on.
      - name: List what the extension installs
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/extension_libraries.py --check-pymupdf "$RUNNER_TEMP"/dry-run/*.txt >> "$GITHUB_STEP_SUMMARY"

      # Installed and started the way Claude Desktop 2.9939.2 does it
      # (scripts/smoke_desktop_extension.py says how), with that uv, in a
      # home folder of the runner's own and the app's short list of
      # variables: the server must list exactly the manifest's tools,
      # create a project in the default folder for projects, list it, and
      # start again with uv offline.
      - name: Install and start it as Claude Desktop does
        shell: bash
        run: |
          home="$RUNNER_TEMP/extension-home"
          mkdir -p "$home"
          HOME="$home" USERPROFILE="$home" python scripts/smoke_desktop_extension.py dist/mcpb/*.mcpb --into "$RUNNER_TEMP/extension-app" --expect-tools manifest --create "Pilot study" --offline-restart

      # v0.14.1, the rename: the update from the published 0.14.0 package,
      # both ways the app may make it: over the old folder with its
      # environment in place, and into the folder emptied first. The
      # script checks both land in the same folder (the identifier) and
      # that the server lists the manifest's tools.
      - name: Update over the published 0.14.0 package, both ways
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/old.mcpb" https://github.com/nicotem/exegete/releases/download/v0.14.0-alpha/qualcoder-mcp-0.14.0-alpha.mcpb
          for way in kept emptied; do
            home="$RUNNER_TEMP/update-home-$way"
            mkdir -p "$home"
            flag=""; [ "$way" = emptied ] && flag="--emptied"
            HOME="$home" USERPROFILE="$home" python scripts/smoke_desktop_extension.py dist/mcpb/*.mcpb --into "$RUNNER_TEMP/update-app-$way" --over "$RUNNER_TEMP/old.mcpb" $flag --expect-tools manifest
          done

      # v0.15.1, the two switches: the update from the published 0.15.0
      # package, both ways as above, with "Tool set" saying core kept
      # from before and the switch "Limit Exegete to its small tool set"
      # at its default, off. After 0.15.1 that text box left the page and
      # the manifest passes no value of it, so the update must list every
      # tool, the manifest's. Then a fresh install with the switch on, as
      # the app passes it, which must list exactly the smaller set
      # (exegete.server.CORE_TOOLSET, from this commit).
      - name: Update over the published 0.15.0 package, an earlier value kept
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/v0150.mcpb" https://github.com/nicotem/exegete/releases/download/v0.15.0-alpha/exegete-0.15.0-alpha.mcpb
          for way in kept emptied; do
            home="$RUNNER_TEMP/update-0150-home-$way"
            mkdir -p "$home"
            flag=""; [ "$way" = emptied ] && flag="--emptied"
            HOME="$home" USERPROFILE="$home" python scripts/smoke_desktop_extension.py dist/mcpb/*.mcpb --into "$RUNNER_TEMP/update-0150-app-$way" --over "$RUNNER_TEMP/v0150.mcpb" $flag --set toolset=core --expect-tools manifest
          done
          home="$RUNNER_TEMP/switch-home"
          mkdir -p "$home"
          HOME="$home" USERPROFILE="$home" python scripts/smoke_desktop_extension.py dist/mcpb/*.mcpb --into "$RUNNER_TEMP/switch-app" --set small_toolset=true --expect-tools core

  desktop-extension-same:
    name: desktop extension, the same bytes on every platform
    needs: desktop-extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download the three builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: desktop-extension-*
          path: builds

      - name: Compare them
        run: |
          sha256sum builds/*/*.mcpb
          test "$(ls builds/*/*.mcpb | wc -l)" -eq 3
          test "$(sha256sum builds/*/*.mcpb | cut -d' ' -f1 | sort -u | wc -l)" -eq 1

  # 0.14.3: the import's stored text against QualCoder's
  # own extraction functions, run without QualCoder's interface
  # (scripts/qualcoder_parity.py): a gate at the release the readers
  # follow, QualCoder 4.0 (tag 4.0, commit b95e021), and a watch on
  # QualCoder's newest code, whose changes are a notice for the lead,
  # never a failure. QualCoder's source is checked out read only;
  # QualCoder itself is never run.
  qualcoder-parity:
    name: QualCoder parity (${{ matrix.which }})
    # v0.15.2: the full tier only (the `tier` job)
    needs: tier
    if: needs.tier.outputs.fast != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    continue-on-error: ${{ matrix.which == 'watch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - which: gate
            # QualCoder 4.0, the release (tag 4.0)
            ref: b95e021c93eb29a646ee7a8de196c281b7890ddf
          - which: watch
            ref: master

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out QualCoder's source, read only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ccbogel/QualCoder
          ref: ${{ matrix.ref }}
          path: qualcoder-src
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # From the lock, as the suite installs (the `test` job says why).
      - name: Install the package with the optional part, from the lock
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m venv "$RUNNER_TEMP/uv-env"
          uvpy="$RUNNER_TEMP/uv-env/bin/python"
          [ -e "$uvpy" ] || uvpy="$RUNNER_TEMP/uv-env/Scripts/python.exe"
          "$uvpy" -m pip install "uv==0.9.7"
          "$uvpy" -m uv export --locked --extra dev --extra pdf-epub --no-emit-project --output-file "$RUNNER_TEMP/locked.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/locked.txt"
          python -m pip install --no-deps -e .

      # Both entries install from the lock (v0.15.1). The gate then
      # reinstalls the EbookLib release the record names, which the lock
      # already holds (tests/test_v0150_lock.py), so its text is compared,
      # not skipped, should the two ever part. PyMuPDF stays as the lock
      # gives it here, 2.0 (v0.15.1), a release the record lists as
      # giving QualCoder's functions the same text (`same_text_with`), so
      # the gate compares QualCoder's own functions with Exegete's under
      # 2.0 and the suite compares each release with the record. The
      # watch now watches QualCoder's newest code alone; the newest
      # library releases have a job of their own, newest-libraries.
      - name: The record's EbookLib release (gate)
        if: matrix.which == 'gate'
        shell: bash
        run: |
          pins=$(python -c "import json; v = json.load(open('tests/fixtures/import_expected.json'))['versions']; print('ebooklib==' + v['ebooklib'])")
          pip install $pins

      - name: Exegete's text against QualCoder's
        env:
          QUALCODER_SOURCE: ${{ github.workspace }}/qualcoder-src
          EXEGETE_PARITY_GATE: ${{ matrix.which == 'gate' && '1' || '' }}
        # and QualCoder's backup, which copies the project folder whole,
        # its Exegete folder included (v0.15.0, the files design); and the
        # names list save_names_list writes, read and applied as
        # QualCoder's import reads and applies it (piece 4)
        run: python -m pytest -ra tests/test_v0143_import_parity.py tests/test_v0150_private_files_qualcoder.py tests/test_v0150_save_names_list_qualcoder.py

      - name: What QualCoder's newest code stores differently
        if: matrix.which == 'watch'
        shell: bash
        run: |
          if ! python scripts/qualcoder_parity.py --qualcoder qualcoder-src --check tests/fixtures/import_expected.json; then
            echo "::notice title=QualCoder parity watch::QualCoder's newest code stores different text for some test documents; the job log names them"
          fi

  # v0.14.1, the rename: the old name's package, built on every full run,
  # the upgrade paths through the old name, offline, and the published
  # 0.14.0 working through the state folder's link. The wheelhouse is
  # fetched once; the tests then install only from it (--no-index), so the
  # real PyPI's qualcoder-mcp can never make them pass. Linux runs them all
  # (the upgrade paths are pip's and uv's, not the platform's), and the
  # transition check's steps followed with the real uv tool and pipx;
  # Windows runs the 0.14.0 proof, through a junction.
  rename-upgrade:
    name: the rename (${{ matrix.os }})
    # v0.15.2: the full tier only (the `tier` job)
    needs: tier
    if: needs.tier.outputs.fast != 'true'
    runs-on: ${{ matrix.os }}
    # Two wheels, a handful of scratch environments and offline installs
    # take a few minutes; twenty ends a hang well before the suite's.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tests: tests/test_v0141_upgrade.py tests/test_v0141_old_name_package.py tests/test_v0141_stand_in.py tests/test_v0141_proof_0140.py tests/test_v0141_transition_installers.py
          - os: windows-latest
            tests: tests/test_v0141_proof_0140.py

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # From the lock, as the suite installs (the `test` job says why),
      # with the development part alone; then setuptools for the tests'
      # builds without isolation (the version the extension's build is
      # pinned to), and uv at the version the app downloads, which these
      # tests run as the real tool.
      - name: Install the package, the build backend and uv
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m venv "$RUNNER_TEMP/uv-env"
          uvpy="$RUNNER_TEMP/uv-env/bin/python"
          [ -e "$uvpy" ] || uvpy="$RUNNER_TEMP/uv-env/Scripts/python.exe"
          "$uvpy" -m pip install "uv==0.9.7"
          "$uvpy" -m uv export --locked --extra dev --no-emit-project --output-file "$RUNNER_TEMP/locked.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/locked.txt"
          python -m pip install --no-deps -e .
          python -m pip install "setuptools==84.0.0" "uv==0.9.7"

      - name: Build the old name's package
        run: python -m build packaging/pypi-old-name --outdir dist/old-name

      # The published qualcoder-mcp 0.14.0a0 comes too, for the proof
      # that it works through the link (or junction) the move leaves;
      # and pipx, with the pip it asks for (26.1 or later), for the
      # transition check's installers test, which installs pipx from here
      # rather than use the runner's own. Exegete's own requirements are
      # read from pyproject.toml (v0.15.1), so its limits reach the
      # wheelhouse.
      - name: Fetch the wheelhouse for the offline tests
        shell: bash
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > "$RUNNER_TEMP/runtime.txt"
          pip download --dest "$RUNNER_TEMP/wheelhouse" --only-binary=:all: -r "$RUNNER_TEMP/runtime.txt" "setuptools==84.0.0" "pipx==1.17.8" "pip>=26.1"
          pip download --dest "$RUNNER_TEMP/wheelhouse" --no-deps --only-binary=:all: "qualcoder-mcp==0.14.0a0"

      # RENAME_TESTS_MUST_RUN turns a skip into a failure, so this job
      # can never pass by running nothing.
      - name: The rename's tests, the slow ones included
        env:
          RENAME_TEST_WHEELHOUSE: ${{ runner.temp }}/wheelhouse
          RENAME_TESTS_MUST_RUN: "1"
        shell: bash
        run: python -m pytest -ra ${{ matrix.tests }}

  # v0.15.1: the links in the documents (scripts/check_links.py). Every
  # relative link and its anchor, and every link to the repository's own
  # documents on main (as the README and the update page give them, so
  # that they work on PyPI and in every installed copy), against the
  # tracked files of this commit. Standard library only, so it runs
  # before anything is installed. The links to other sites are checked
  # once a week instead (external-links.yml). Then the facts the
  # documents repeat (tests/test_v0151_facts.py): the folders, the time
  # per import call and the tool counts, held to the code's constants,
  # which needs the package; the answer comes in about two minutes.
  documents:
    name: documents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: The links inside the repository
        run: python scripts/check_links.py

      # From the lock, as the libraries' install does: uv, at the version
      # the extension job uses, in an environment of its own, so it never
      # joins the path; `--locked` fails when pyproject.toml and uv.lock
      # disagree; pip installs the exported releases, each checked
      # against its hash, then the package itself without dependencies.
      - name: Install the package from the lock
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m venv "$RUNNER_TEMP/uv-env"
          uvpy="$RUNNER_TEMP/uv-env/bin/python"
          "$uvpy" -m pip install "uv==0.9.7"
          "$uvpy" -m uv export --locked --extra dev --no-emit-project --output-file "$RUNNER_TEMP/locked.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/locked.txt"
          python -m pip install --no-deps -e .

      - name: The facts the documents repeat
        run: python -m pytest -q tests/test_v0151_facts.py

  # v0.15.1: the newest library releases. Every other job that runs tests
  # installs from the lock; this one takes the newest release of each
  # library pyproject.toml allows, what an install from PyPI takes today
  # (pip, pipx, `uv tool`), and runs the suite with them. It may fail and
  # only reports: a red result is read by the maintainer and never blocks
  # a merge (continue-on-error, and no job needs it). Its summary gives
  # the release of each bounded library it installed, and Starlette's,
  # which the MCP library loads at every start without a limit, and the
  # newest release of each on PyPI, so a new major release beyond a limit
  # (PyMuPDF 2.0, the MCP library's 2.0) is seen without being installed.
  newest-libraries:
    name: the newest library releases (reports only)
    # v0.15.2: the full tier only (the `tier` job); still no job needs it
    needs: tier
    if: needs.tier.outputs.fast != 'true'
    runs-on: ubuntu-latest
    # Measured on its first run (20 October 2026, run 39416267478): this
    # job took 28 minutes, its install included, and the suite on Ubuntu
    # 21 and 26 minutes in the `test` jobs. 45 is about one and a half
    # times this job's run, the margin the `test` job's own limit keeps
    # over its slowest green job; a hang is named first, by the per-test
    # limit. A run that reaches the limit ends red, which here only
    # reports, as any red in this job does.
    timeout-minutes: 45
    permissions:
      contents: read
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # uv in an environment of its own, as in the `test` job; `--python`
      # names the job's own interpreter, since `--system` alone takes the
      # first Python uv finds.
      - name: Install the newest releases pyproject.toml allows
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m venv "$RUNNER_TEMP/uv-env"
          uvpy="$RUNNER_TEMP/uv-env/bin/python"
          "$uvpy" -m pip install "uv==0.9.7"
          "$uvpy" -m uv pip install --system --python "$(python -c 'import sys; print(sys.executable)')" -e ".[dev,pdf-epub]"

      # Before the suite, so it is read even when the suite fails or runs
      # out of time. Its table is written under the runner's temporary
      # folder, never into the checkout the suite then runs in.
      - name: The releases installed, and the newest on PyPI
        shell: bash
        run: |
          python - "$RUNNER_TEMP/releases.md" <<'EOF'
          import json, re, subprocess, sys, tomllib
          from packaging.specifiers import SpecifierSet

          def key(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          limits = {}
          for line in (project["dependencies"]
                       + project["optional-dependencies"]["pdf-epub"]):
              name = re.match(r"[A-Za-z0-9_.-]+", line).group(0)
              if "<" in line:
                  limits[key(name)] = line[len(name):].split(";")[0].strip()
          listed = subprocess.run(
              [sys.executable, "-m", "pip", "list", "--format=json"],
              capture_output=True, text=True, check=True).stdout
          installed = {key(p["name"]): p["version"] for p in json.loads(listed)}
          rows = ["| library | limit | installed here | newest on PyPI |",
                  "|---|---|---|---|"]
          for name in [*limits, "starlette"]:
              found = subprocess.run(
                  [sys.executable, "-m", "pip", "index", "versions", name],
                  capture_output=True, text=True).stdout
              newest = re.match(r"\S+ \(([^)]+)\)", found)
              newest = newest.group(1) if newest else "not found"
              limit = limits.get(name, "none")
              here = installed.get(name, "not installed")
              rows.append(f"| {name} | {limit} | {here} | {newest} |")
              print(f"::notice title=newest library releases::{name}: "
                    f"installed {here}, newest on PyPI {newest}, limit {limit}")
              if name in limits and newest != "not found" and \
                      not SpecifierSet(limits[name]).contains(newest):
                  print(f"::warning title=a release beyond a limit::{name} "
                        f"{newest} is on PyPI, beyond {limit}")
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write("\n".join(rows) + "\n")
          EOF
          {
            echo "### The newest library releases: ubuntu-latest / py3.13"
            echo ""
            cat "$RUNNER_TEMP/releases.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # The suite as the `test` job runs it; its summary line and its
      # failures go to the summary and to annotations, as there. Its
      # output, too, is kept under the runner's temporary folder.
      - name: The suite on the newest releases
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/pytest_output.txt"
          python -m pytest -ra --tb=short -q 2>&1 | tee "$out"
          code=${PIPESTATUS[0]}
          summary=$(grep -E "^[0-9]+ (passed|failed|error)|^(=+ )?[0-9]+ (failed|passed|errors?)[ ,]" "$out" | tail -1)
          {
            echo "### pytest on the newest releases: ubuntu-latest / py3.13"
            echo ""
            echo '```'
            echo "${summary:-no summary line: the run ended before pytest wrote one}"
            grep -E "^(FAILED|ERROR) " "$out" | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR) " "$out" | head -10 \
            | sed -e 's/%/%25/g' -e 's/^/::error title=pytest, newest releases::/'
          if [ -n "$summary" ]; then
            echo "::notice title=pytest summary, newest releases::$(echo "$summary" | sed 's/%/%25/g')"
          else
            tail -10 "$out" | sed -e 's/%/%25/g' -e 's/^/::error title=pytest output tail::/'
          fi
          exit $code
