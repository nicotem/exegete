name: CI

# The PyMuPDF 2.0 trial (v0.15.1). On this branch alone, which is never
# merged, every usual job is replaced by one trial job: two environments
# from the lock, PyMuPDF 2.0 over the second, the PDF tests run again
# and again with 2.0, and the probes the owner's form needs. Every
# result is kept as an artefact; a red test is a result, not a stop.
on:
  push:
    branches: ["exp/0151-pymupdf-2-trial"]
  workflow_dispatch:

jobs:
  trial:
    name: PyMuPDF 2.0 trial (${{ matrix.os }}, py3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RUNS: ${{ matrix.os == 'ubuntu-latest' && '10' || '3' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Two environments from the lock, PyMuPDF 2.0 over the second
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trial-logs"; mkdir -p "$out"
          python -m venv "$RUNNER_TEMP/uv-env"
          uvpy="$RUNNER_TEMP/uv-env/bin/python"
          [ -e "$uvpy" ] || uvpy="$RUNNER_TEMP/uv-env/Scripts/python.exe"
          "$uvpy" -m pip install "uv==0.9.7"
          "$uvpy" -m uv export --locked --extra dev --extra pdf-epub --no-emit-project --output-file "$RUNNER_TEMP/locked.txt"
          for env in lock new; do
            python -m venv "$RUNNER_TEMP/$env"
            py="$RUNNER_TEMP/$env/bin/python"
            [ -e "$py" ] || py="$RUNNER_TEMP/$env/Scripts/python.exe"
            "$py" -m pip install --require-hashes -r "$RUNNER_TEMP/locked.txt"
            "$py" -m pip install --no-deps -e .
            echo "$(echo $env | tr a-z A-Z)PY=$py" >> "$GITHUB_ENV"
          done
          newpy="$RUNNER_TEMP/new/bin/python"
          [ -e "$newpy" ] || newpy="$RUNNER_TEMP/new/Scripts/python.exe"
          "$newpy" -m pip install "pymupdf==2.0" 2>&1 | tee "$out/pip-new.txt"
          for env in lock new; do
            py="$RUNNER_TEMP/$env/bin/python"
            [ -e "$py" ] || py="$RUNNER_TEMP/$env/Scripts/python.exe"
            "$py" -c "import importlib.metadata as m; print('$env: pymupdf', m.version('pymupdf'))" | tee -a "$out/versions.txt"
            "$py" -m pip list --format=freeze > "$out/pip-list-$env.txt"
          done
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: The PDF fixtures' text, written with 1.28.2, read with each
        shell: bash
        run: |
          set -euo pipefail
          "$LOCKPY" trial/fixtures_text.py write "$RUNNER_TEMP/fixtures"
          "$LOCKPY" trial/fixtures_text.py read "$RUNNER_TEMP/fixtures" "$OUT/text-lock.json"
          "$NEWPY" trial/fixtures_text.py read "$RUNNER_TEMP/fixtures" "$OUT/text-new.json"
          "$NEWPY" trial/fixtures_text.py compare "$OUT/text-lock.json" "$OUT/text-new.json" | tee "$OUT/text-compare.txt"

      - name: The PDF test files, once with 1.28.2 and RUNS times with 2.0
        shell: bash
        run: |
          set +e
          files=$(git grep -l -E "import_fixtures\.PDF|import pymupdf|optional_part_installed|all_fixtures\(|write_all\(" tests | grep "/test_"; echo tests/test_v0143_reading_process.py)
          echo "$files" > "$OUT/pdf-files.txt"
          run() {
            "$1" -c "import importlib.metadata as m; print('pymupdf', m.version('pymupdf'))" > "$OUT/pdf-$2.txt"
            "$1" -m pytest -q -ra --tb=short -p no:cacheprovider -o log_cli=true --log-cli-level=WARNING $files >> "$OUT/pdf-$2.txt" 2>&1
            echo "$2: exit $? | $(grep -E '[0-9]+ (passed|failed)' "$OUT/pdf-$2.txt" | tail -1)" | tee -a "$OUT/pdf-summary.txt"
          }
          run "$LOCKPY" lock-1
          for i in $(seq 1 "$RUNS"); do run "$NEWPY" "new-$i"; done
          grep -h "^FAILED\|^ERROR" "$OUT"/pdf-new-*.txt | sort | uniq -c > "$OUT/pdf-failures.txt"
          grep -h "refused as damaged" "$OUT"/pdf-*.txt | sed 's/^.*WARNING//' | sort | uniq -c > "$OUT/pdf-damaged-lines.txt"
          exit 0

      - name: Memory, at five caps, twenty times each (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "$LOCKPY" trial/memory_probe.py "$RUNNER_TEMP/fixtures" 20 "$OUT/memory-lock.json" | tee "$OUT/memory-lock.txt"
          "$NEWPY" trial/memory_probe.py "$RUNNER_TEMP/fixtures" 20 "$OUT/memory-new.json" | tee "$OUT/memory-new.txt"

      - name: Network, with Python's own recorders on every system
        shell: bash
        run: |
          set -euo pipefail
          "$LOCKPY" trial/network_probe.py "$RUNNER_TEMP/fixtures" "$OUT/net-lock.json" > /dev/null
          "$NEWPY" trial/network_probe.py "$RUNNER_TEMP/fixtures" "$OUT/net-new.json" > /dev/null
          for env in lock new; do
            python -c "import json,sys; d=json.load(open(sys.argv[1])); print(sys.argv[2], d['pymupdf'], 'import events', len(d['import_events']), 'reading events', len(d['reading_events'])); [print('  ', e) for e in d['import_events'] + d['reading_events']]; [print('  ', k, v) for k, v in d['readings'].items()]" "$OUT/net-$env.json" "$env" | tee -a "$OUT/net-summary.txt"
          done

      - name: Network, under strace and with no network at all (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -q strace > /dev/null
          for env in lock new; do
            py="$RUNNER_TEMP/$env/bin/python"
            strace -f -qq -e trace=network -o "$OUT/strace-$env.txt" "$py" trial/network_probe.py "$RUNNER_TEMP/fixtures" "$OUT/net-strace-$env.json" > /dev/null
            sudo unshare -n -- sudo -u "$(id -un)" env "PATH=$PATH" "HOME=$HOME" "$py" trial/network_probe.py "$RUNNER_TEMP/fixtures" "$OUT/net-unshared-$env.json" > /dev/null
            echo "$env: network system calls under strace: $(wc -l < "$OUT/strace-$env.txt")" | tee -a "$OUT/net-summary.txt"
            sed -E 's/^[0-9]+ +//; s/\(.*//' "$OUT/strace-$env.txt" | sort | uniq -c | tee -a "$OUT/net-summary.txt"
            python -c "import json,sys; a=json.load(open(sys.argv[1]))['readings']; b=json.load(open(sys.argv[2]))['readings']; print(sys.argv[3], 'readings with no network the same:', a == b)" "$OUT/net-$env.json" "$OUT/net-unshared-$env.json" "$env" | tee -a "$OUT/net-summary.txt"
          done

      - name: What one reading process costs, and the size installed
        shell: bash
        run: |
          set -euo pipefail
          "$LOCKPY" trial/cost_probe.py "$RUNNER_TEMP/fixtures" "$OUT/cost-lock.json" | tee "$OUT/cost-lock.txt"
          "$NEWPY" trial/cost_probe.py "$RUNNER_TEMP/fixtures" "$OUT/cost-new.json" | tee "$OUT/cost-new.txt"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### PyMuPDF 2.0 trial: ${{ matrix.os }}, Python 3.13"
            echo '```'
            for f in versions.txt text-compare.txt pdf-summary.txt pdf-failures.txt pdf-damaged-lines.txt memory-lock.txt memory-new.txt net-summary.txt cost-lock.txt cost-new.txt; do
              [ -f "$OUT/$f" ] && { echo "== $f"; head -80 "$OUT/$f"; }
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pymupdf-2-trial-${{ matrix.os }}
          path: ${{ runner.temp }}/trial-logs
          retention-days: 14
