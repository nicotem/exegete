name: Weekly link check

# v0.15.1: the links in the documents that lead to other sites
# (scripts/check_links.py --external), once a week, since a site can move
# or close without any change here; the links inside the repository are
# checked on every push (ci.yml, the documents job). A 404, a 410 or a
# name that does not resolve fails; an answer that only turns robots
# away, a slow site or an address not reached within the run's ten
# minutes is a notice. The failures and notices are in the step summary.
# A workflow of its own, so that a push changing anything else never
# checks third-party sites. A schedule runs from main only, so a push
# that changes this workflow or the script also runs it, on its branch.
on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/external-links.yml"
      - "scripts/check_links.py"

jobs:
  external-links:
    name: links to other sites
    runs-on: ubuntu-latest
    # The script's own budget is ten minutes; a request may still be
    # waiting for its answer when it ends.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: The links to other sites
        run: python scripts/check_links.py --external
