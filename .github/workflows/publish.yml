name: Publish to PyPI

# Two publish paths, both via PyPI Trusted Publishing (OIDC: no tokens,
# no secrets stored in the repo):
#
#   1. TestPyPI, manual dry-run: trigger the workflow by hand
#      (workflow_dispatch) and it publishes to test.pypi.org.
#   2. PyPI, the real thing: publishing happens automatically when a
#      GitHub Release is PUBLISHED.
#   3. PyPI, an early build of the coming release (v0.14.1, the owner's
#      ruling 41, decision 10, to hold the name): a GitHub pre-release
#      whose tag is the release's plus `.devN` (for example
#      v0.14.1-alpha.dev1) builds `exegete` alone at that development
#      version (0.14.1a0.dev1) and uploads it; the old name's package is
#      never built for it, so nobody who has qualcoder-mcp 0.14.0 is
#      moved onto unfinished work. Any other tag refuses to build
#      (scripts/release_version.py).
#
# Two packages, built and uploaded together (v0.14.1, the rename):
# `exegete`, the server, and `qualcoder-mcp`, the old name's package
# (packaging/pypi-old-name), released beside every release until v1.0 so
# that upgrades through the old name keep bringing the current server.
# One upload step per index carries both: the action's README says that
# running it twice in one job "is not considered supported", and PyPI's
# one short-lived upload permission covers both projects when their
# trusted publishers are identical (below).
#
# The trusted publishers the owner configures, four in all, every field
# identical, letter case included (owner `nicotem`, repository `exegete`,
# workflow `publish.yml`, and the environment named for the index):
#   - test.pypi.org  → project qualcoder-mcp, environment "testpypi"
#   - test.pypi.org  → project exegete (a pending publisher until the
#                      first upload), environment "testpypi"
#   - pypi.org       → project qualcoder-mcp, environment "pypi"
#   - pypi.org       → project exegete (pending until the first
#                      upload), environment "pypi"
# PyPI links a pending publisher to an existing one only when all four
# fields are equal, and the upload permission then covers every project
# linked to it (warehouse: `reify` in oidc/models/github.py,
# `caveats.ProjectID` in oidc/views.py).
#
# Protection: the `pypi` environment is limited on GitHub to tags
# matching `v*`, so nothing reaches PyPI except from a release.
# `testpypi` stays open, since the rehearsal runs from a branch.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are SHA-pinned (supply-chain hardening); the trailing
      # comment is the human-readable version Dependabot bumps against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      # Releases only: what the tag asks for. `vV` (V being pyproject's
      # version) is a release and builds both packages; `vV.devN` on a
      # pre-release is an early build and builds `exegete` alone at that
      # development version; any other tag stops the run here. The tag
      # reaches the script through the environment, never the command.
      - name: Version from the tag (releases only)
        id: tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: python scripts/release_version.py "$TAG" "$PRERELEASE" >> "$GITHUB_OUTPUT"

      # Manual runs only (the TestPyPI rehearsal), never a release: both
      # packages take a practice version, the release's own plus
      # .dev<run number>, so each rehearsal uploads file names never used
      # before (TestPyPI refuses a used file name for good).
      - name: Practice version (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/practice_version.py "${{ github.run_number }}"

      - name: Build distributions
        env:
          KIND: ${{ steps.tag.outputs.kind }}
        run: |
          python -m build
          # never for an early build: the old name's package stays at the
          # last release until the coming release is out
          if [ "$KIND" != "early" ]; then
            python -m build packaging/pypi-old-name --outdir dist/
          fi

      - name: An early build holds exegete alone
        if: steps.tag.outputs.kind == 'early'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ls dist/
          test -f "dist/exegete-$VERSION.tar.gz"
          test -f "dist/exegete-$VERSION-py3-none-any.whl"
          test "$(ls dist/ | wc -l)" -eq 2

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Store distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI (manual dry-run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/exegete
    permissions:
      id-token: write  # mandatory for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2 (release/v1)
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI (on GitHub Release)
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/exegete
    permissions:
      id-token: write  # mandatory for Trusted Publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      # Both packages in one step, exegete first (alphabetical order).
      # skip-existing: a release whose upload stopped after exegete can
      # be run again without failing on the files already there.
      # Recovery: re-run the failed job from the run's page; then check
      # both project pages, pypi.org/p/exegete and pypi.org/p/qualcoder-mcp.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2 (release/v1)
        with:
          skip-existing: true
