[project]
name = "qualcoder-mcp"
version = "0.14.0-alpha"
description = "Model Context Protocol server for Qualcoder qualitative data analysis with AI-assisted coding"
authors = [{name = "Niccolò Tempini", email = "n.tempini@exeter.ac.uk"}]
# PEP 639 SPDX licence expression (setuptools >= 77). LGPL-3.0-or-later
# from v0.13, QualCoder's own licence; releases up to 0.12.1 were
# published under MIT (see NOTICE).
# COPYING.LESSER is the LGPL text and legal/GPL-3.0.txt the GPL text it
# incorporates. GitHub's licence detector reads the top folder and a
# top-level LICENSES/ folder, and legal/ is neither, which is why the GPL
# text sits there: GitHub then reads the project's licence as the LGPL
# alone. NOTICE names the code derived from QualCoder. PEP 639 supersedes
# licence classifiers with the expression, and setuptools refuses a
# "License :: ..." classifier beside one, so none is listed below.
license = "LGPL-3.0-or-later"
license-files = ["COPYING.LESSER", "legal/GPL-3.0.txt", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "qualitative research",
    "qualcoder",
    "mcp",
    "model-context-protocol",
    "claude",
    "qda",
    "caqdas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # >=1.17.0 floor: QUALCODER_MCP_TOOLSET=core calls FastMCP.remove_tool,
    # which does not exist before mcp 1.17.0. The floor used to read
    # >=1.2.0, so a user installing at or near it got a server that could
    # not honour its own documented setting: core mode raised
    # AttributeError: 'FastMCP' object has no attribute 'remove_tool'.
    # Measured rather than read, on Python 3.10.16 in throwaway venvs
    # against this tree: 1.2.0 and 1.16.0 fail that way, 1.17.0 registers
    # the 21 core tools and starts.
    #
    # <2 cap: mcp 2.0.0 (July 2026) removed mcp.server.fastmcp, so an
    # uncapped install resolves to 2.x and the server cannot import
    # (verified empirically in a fresh venv). Lifting the cap is an
    # explicit migration project, not a routine bump.
    "mcp>=1.17.0,<2",
]

[project.urls]
Homepage = "https://github.com/nicotem/qualcoder_mcp"
Repository = "https://github.com/nicotem/qualcoder_mcp"
Issues = "https://github.com/nicotem/qualcoder_mcp/issues"
Changelog = "https://github.com/nicotem/qualcoder_mcp/blob/main/CHANGELOG.md"
Privacy = "https://github.com/nicotem/qualcoder_mcp/blob/main/PRIVACY.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "xmlschema>=3.0.0",
    "hypothesis>=6.100",
    "build>=1.2",
    "twine>=6.1",
]

[tool.pytest.ini_options]
markers = [
    "giant: large 10k+ coding / 500k-char build; opt-in via TRACK6_GIANT=1",
]
# The per-test limit (v0.14): when one test, setup and teardown included,
# has run for ten minutes, pytest writes every thread's stack to the
# output, the test's own frame among them, so a hang is named in the CI
# log before the job's own limit (.github/workflows/ci.yml) ends it. It is
# pytest's built-in use of the standard library's faulthandler, so it
# needs no dependency, and it changes no verdict: a slow test on a slow
# runner still passes. The slowest test takes under 30 seconds on a
# developer's machine, and the slowest green Windows job ran the suite
# eight to nine times slower than that machine does.
faulthandler_timeout = 600
# A warning raised by our own modules fails the run (fix round 1, F19).
# Scoped to this package: a dependency's DeprecationWarning is not ours
# to fix, and failing on one would pin third-party release notes into
# this suite. tests/test_suite_hygiene.py covers the compile-time half,
# which no runtime filter can see.
filterwarnings = [
    "error:::qualcoder_mcp.*",
]
# One filter is deliberately NOT here (fix round 2): the one that turns
# pytest's PytestUnraisableExceptionWarning into an error. An unclosed
# sqlite3.Connection is a ResourceWarning on Python 3.13, raised during
# FINALISATION, so pytest
# re-emits it from _pytest/unraisableexception.py; the module filter
# above matches on the module a warning is issued from and therefore
# cannot see it. That filter is how four of the five unclosed
# connections in this suite were found, and it is one flag away for
# anyone hunting the class:
#
#     python -m pytest tests/ -W error::pytest.PytestUnraisableExceptionWarning
#
# It is not shipped as a gate because its ATTRIBUTION is not
# deterministic: the warning lands on whichever test is running when the
# collector next runs, so it names a different test each time, and it
# needs both an interpreter that emits the warning and a run long enough
# for a collection to happen. A gate has to name the line every time.
#
# Fix round 3 replaced the argument that used to sit here. It said the
# class was not empty and the next instance would have to be caught by
# running under this flag until it fired. The fifth and last instance
# was found instead by reading the syntax, in milliseconds: a
# sqlite3.connect(...) whose result is never bound, so nothing can close
# it. That sweep is what ships as the gate, in tests/test_suite_hygiene.py
# (TestNoConnectionIsOpenedWithNothingToCloseIt); run against the
# fix-round-1 tree it returns all five sites, and against this one it
# returns none. The runtime half ships too, in tests/conftest.py:
# nothing may be left OPEN at the end of the run.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
qualcoder-mcp = "qualcoder_mcp.server:main"

# For uv, which the Claude Desktop extension installs with (v0.14; pip
# and PyPI builds ignore this table). The extension's `uv sync` must
# never compile anything on a researcher's computer, so the lock has to
# hold a wheel for every computer Claude Desktop runs on (and Linux,
# for CI): tests/test_v014_desktop_extension.py checks uv.lock against
# this list, and CI asks uv the same for each one.
[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'win32' and platform_machine == 'ARM64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# cryptography (through mcp's pyjwt[crypto]; the server never imports
# it) is a Rust build without a wheel: without this, uv falls back to
# compiling it, which downloads a Rust toolchain and then fails for want
# of OpenSSL. With it, uv locks a version that has a wheel for each
# computer: 50.0.1 in general, 48.0.1 on Intel Macs (the last with a
# universal2 wheel) and 46.0.3 on Windows on Arm (the last with a
# win_arm64 wheel).
no-build-package = ["cryptography"]
# Keeps Intel Macs on 48.0.1, which fixes the OpenSSL its older wheels
# bundled, rather than the 46.0.3 Windows on Arm needs.
constraint-dependencies = [
    "cryptography>=48.0.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
]
# The build backend uv installs the package with, pinned to the version
# the extension's CI install used, since build requirements are not in
# uv.lock and are otherwise the newest on the day of each install.
build-constraint-dependencies = ["setuptools==84.0.0"]
